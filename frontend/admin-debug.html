<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Debug Admin Orders</title></head>
<body style="font-family:monospace;padding:40px;background:#1a1a1a;color:#0f0">
<h1>🔍 Admin Orders Debug</h1>
<div id="log"></div>
<script>
const API = 'http://localhost:8000/api/v1';
const log = document.getElementById('log');

function addLog(msg, color = '#0f0') {
    const p = document.createElement('p');
    p.style.color = color;
    p.textContent = msg;
    log.appendChild(p);
}

async function test() {
    try {
        // 1. Login
        addLog('1. Logging in as admin...');
        const loginRes = await fetch(`${API}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: 'admin@godavari.com', password: 'admin1234' })
        });
        addLog(`   Status: ${loginRes.status}`);
        
        if (!loginRes.ok) {
            addLog(`   ❌ Login failed: ${await loginRes.text()}`, '#f00');
            return;
        }
        
        const loginData = await loginRes.json();
        addLog(`   ✅ Token: ${loginData.access_token.substring(0,30)}...`);
        
        const token = loginData.access_token;
        const payload = JSON.parse(atob(token.split('.')[1]));
        addLog(`   Role: ${payload.role}`);
        
        if (payload.role !== 'admin') {
            addLog(`   ❌ Not admin! Role is: ${payload.role}`, '#f00');
            return;
        }
        
        // 2. Fetch orders
        addLog('\n2. Fetching orders...');
        const ordersRes = await fetch(`${API}/orders`, {
            headers: { Authorization: `Bearer ${token}` }
        });
        addLog(`   Status: ${ordersRes.status}`);
        
        if (!ordersRes.ok) {
            addLog(`   ❌ Failed: ${await ordersRes.text()}`, '#f00');
            return;
        }
        
        const orders = await ordersRes.json();
        addLog(`   ✅ Received ${orders.length} orders`);
        
        if (orders.length === 0) {
            addLog(`   ℹ️ No orders in database yet`, '#fa0');
        } else {
            addLog(`\n3. Order details:`);
            orders.forEach((o, i) => {
                addLog(`   Order ${i+1}: ${o.id.substring(0,8)} | ${o.status} | ₹${o.total_amount} | ${new Date(o.created_at).toLocaleString()}`);
            });
        }
        
    } catch (e) {
        addLog(`❌ ERROR: ${e.message}`, '#f00');
        addLog(`   ${e.stack}`, '#f00');
    }
}

addLog('Starting diagnostic...\n');
test();
</script>
</body></html>
