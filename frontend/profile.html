<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account — Godavari Ghaatu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root {
            --saffron:    #E8772E;
            --turmeric:   #F5A623;
            --deep-green: #3D1560;
            --leaf:       #6B2FA0;
            --cream:      #FDF5FF;
            --warm-white: #FEF9FF;
            --charcoal:   #1A0A2E;
            --muted:      #6B5080;
            --border:     #E0C8F0;
            --red-spice:  #C0392B;
        }
        html{scroll-behavior:smooth}
        body{font-family:'Lato',sans-serif;background:#F4F1ED;color:var(--charcoal);min-height:100vh}
        .ann-bar{background:var(--deep-green);color:#fff;text-align:center;padding:9px 20px;font-size:13px;font-weight:500}
        .ann-bar span{color:var(--turmeric);font-weight:600}
        nav{background:var(--warm-white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 60px;display:flex;align-items:center;justify-content:space-between;height:68px;box-shadow:0 2px 20px rgba(0,0,0,.06)}
        .nav-logo{text-decoration:none}
        .nav-logo .brand{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--deep-green);display:block}
        .nav-logo .sub{font-size:10px;color:var(--saffron);letter-spacing:2px;text-transform:uppercase;font-weight:600}
        .nav-links{display:flex;gap:32px;list-style:none}
        .nav-links a{text-decoration:none;color:var(--charcoal);font-size:14px;font-weight:500;transition:color .2s}
        .nav-links a:hover{color:var(--saffron)}
        .nav-actions{display:flex;align-items:center;gap:16px}
        .nav-icon-btn{background:none;border:none;cursor:pointer;color:var(--charcoal);font-size:22px;position:relative;padding:4px}
        .cart-count{position:absolute;top:-4px;right:-6px;background:var(--saffron);color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
        .btn-logout-nav{background:none;border:1.5px solid var(--border);color:var(--charcoal);padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Lato',sans-serif;transition:all .2s}
        .btn-logout-nav:hover{border-color:var(--red);color:var(--red)}
        .page-header{background:var(--deep-green);padding:40px 60px;position:relative;overflow:hidden}
        .page-header::before{content:'';position:absolute;inset:0;opacity:.05;background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:24px 24px}
        .page-header-inner{position:relative;z-index:1;display:flex;align-items:center;gap:24px}
        .avatar-circle{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--saffron),var(--turmeric));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;flex-shrink:0;border:3px solid rgba(255,255,255,.2)}
        .user-greeting .hello{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:4px}
        .user-greeting .uname{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#fff}
        .user-greeting .uemail{font-size:13px;color:rgba(255,255,255,.6);margin-top:3px}
        .header-stats{margin-left:auto;display:flex;gap:32px}
        .hstat{text-align:center}
        .hstat-num{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--turmeric)}
        .hstat-label{font-size:12px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
        .profile-layout{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:28px 60px;max-width:1200px;margin:0 auto;align-items:start}
        .profile-sidebar{position:sticky;top:84px}
        .sidebar-card{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden}
        .sidebar-nav-item{display:flex;align-items:center;gap:12px;padding:14px 18px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted);border-left:3px solid transparent;transition:all .2s;text-decoration:none;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;font-family:'Lato',sans-serif}
        .sidebar-nav-item:hover{background:var(--cream);color:var(--charcoal)}
        .sidebar-nav-item.active{background:#FFF0EC;color:var(--saffron);border-left-color:var(--saffron);font-weight:600}
        .sidebar-nav-item .s-icon{font-size:18px;width:22px;text-align:center}
        .sidebar-divider{height:1px;background:var(--border)}
        .content-panel{min-width:0}
        .tab-pane{display:none;animation:fadeIn .3s ease}
        .tab-pane.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .card{background:#fff;border-radius:14px;border:1px solid var(--border);margin-bottom:20px;overflow:hidden}
        .card-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .card-head h3{font-family:'Playfair Display',serif;font-size:18px;font-weight:700}
        .card-body{padding:24px}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
        .form-grid.single{grid-template-columns:1fr}
        .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px}
        .field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:'Lato',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}
        .field input:focus{border-color:var(--saffron);box-shadow:0 0 0 3px rgba(139,26,26,.08)}
        .field input:disabled{background:#F9F9F9;color:var(--muted)}
        .btn-save{background:var(--saffron);color:#fff;border:none;padding:11px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif;transition:background .2s}
        .btn-save:hover{background:var(--deep-green)}
        .form-msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
        .form-msg.show{display:block}
        .form-msg.error{background:#FFF0EE;border:1px solid #FFB4A8;color:var(--red)}
        .form-msg.success{background:#FFF0EC;border:1px solid #D4956A;color:var(--leaf)}
        .order-filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
        .order-filter-btn{background:#fff;border:1.5px solid var(--border);color:var(--muted);padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Lato',sans-serif;transition:all .2s}
        .order-filter-btn.active,.order-filter-btn:hover{border-color:var(--saffron);color:var(--saffron);background:#FFF0EC}
        .order-card{background:#fff;border-radius:12px;border:1px solid var(--border);margin-bottom:16px;overflow:hidden;transition:box-shadow .2s}
        .order-card:hover{box-shadow:0 6px 24px rgba(0,0,0,.08)}
        .order-card-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #F5F5F5;cursor:pointer}
        .order-id-text{font-size:13px;font-weight:700;font-family:monospace}
        .order-date-text{font-size:12px;color:var(--muted);margin-top:2px}
        .order-status{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
        .status-PENDING{background:#FFF8E1;color:#F59E0B}
        .status-PAID{background:#FDF0EC;color:#7A2020}
        .status-PACKED{background:#E8EAF6;color:#8B1A1A}
        .status-SHIPPED{background:#E3F2FD;color:#7A2020}
        .status-DELIVERED{background:#FDF0EC;color:#4A0A0A}
        .status-CANCELLED{background:#F5F5F5;color:#999}
        .order-card-body{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer}
        .order-items-preview{display:flex;gap:6px;flex-wrap:wrap;flex:1}
        .order-item-chip{background:var(--cream);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500}
        .order-total-amt{font-size:18px;font-weight:700}
        .order-sub-info{font-size:12px;color:var(--muted);margin-top:2px}
        .order-expand-arrow{font-size:18px;color:var(--muted);transition:transform .3s;display:inline-block}
        .order-card.expanded .order-expand-arrow{transform:rotate(180deg)}
        .order-detail-panel{display:none;border-top:1px solid var(--border)}
        .order-card.expanded .order-detail-panel{display:block}
        .timeline-wrap{padding:24px 20px 16px}
        .timeline-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:20px}
        .timeline-steps{display:flex;align-items:flex-start;position:relative}
        .timeline-steps::before{content:'';position:absolute;top:15px;left:16px;right:16px;height:2px;background:var(--border);z-index:0}
        .t-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;z-index:1}
        .t-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:8px;flex-shrink:0;transition:all .3s}
        .t-step.done .t-dot{background:var(--leaf);border-color:var(--leaf);color:#fff}
        .t-step.current .t-dot{background:var(--saffron);border-color:var(--saffron);color:#fff;animation:tPulse 1.5s ease-in-out infinite}
        .t-step.cancelled .t-dot{background:var(--red);border-color:var(--red);color:#fff}
        @keyframes tPulse{0%,100%{box-shadow:0 0 0 0 rgba(139,26,26,.4)}50%{box-shadow:0 0 0 8px rgba(37,211,102,0)}}
        .t-label{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
        .t-step.done .t-label,.t-step.current .t-label{color:var(--charcoal)}
        .order-items-section{padding:0 20px 16px}
        .oi-section-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
        .oi-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F8F8F8}
        .oi-row:last-child{border-bottom:none}
        .oi-img{width:42px;height:42px;border-radius:8px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
        .oi-name{font-size:13px;font-weight:600}
        .oi-variant{font-size:11px;color:var(--muted)}
        .oi-qty{font-size:12px;color:var(--muted);white-space:nowrap}
        .oi-price{font-size:14px;font-weight:700}
        .order-breakdown{margin:0 20px 20px;background:var(--cream);border-radius:10px;padding:14px 16px}
        .ob-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--muted)}
        .ob-row.total{margin-bottom:0;font-weight:700;color:var(--charcoal);font-size:15px;padding-top:8px;border-top:1px dashed var(--border)}
        .wishlist-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
        .wish-card{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;transition:transform .2s,box-shadow .2s}
        .wish-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
        .wish-img{height:110px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,var(--cream),#F5E6D0);position:relative}
        .wish-remove-btn{position:absolute;top:8px;right:8px;background:#fff;border:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:background .2s}
        .wish-remove-btn:hover{background:#FFE8E8}
        .wish-body{padding:10px 12px}
        .wish-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;margin-bottom:4px}
        .wish-price{font-size:14px;font-weight:700;color:var(--saffron);margin-bottom:8px}
        .wish-atc{width:100%;background:var(--deep-green);color:#fff;border:none;padding:7px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Lato',sans-serif;transition:background .2s}
        .wish-atc:hover{background:var(--saffron)}
        .empty-state{text-align:center;padding:60px 20px}
        .empty-icon{font-size:56px;margin-bottom:16px}
        .empty-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;margin-bottom:8px}
        .empty-desc{font-size:14px;color:var(--muted);margin-bottom:20px}
        .btn-shop{background:var(--saffron);color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif;text-decoration:none;display:inline-block}
        .btn-shop:hover{background:var(--deep-green)}
        .toast{position:fixed;bottom:28px;right:28px;background:var(--charcoal);color:#fff;padding:13px 20px;border-radius:10px;font-size:14px;font-weight:500;z-index:500;transform:translateY(20px);opacity:0;transition:all .3s;max-width:300px}
        .toast.show{transform:translateY(0);opacity:1}
        .toast.success{background:var(--leaf)}
        .toast.error{background:var(--red)}
        @media(max-width:900px){
            nav{padding:0 20px}
            .nav-links{display:none}
            .page-header{padding:28px 20px}
            .header-stats{display:none}
            .profile-layout{grid-template-columns:1fr;padding:16px 20px}
            .profile-sidebar{position:static}
            .sidebar-card{display:flex;overflow-x:auto;border-radius:10px}
            .sidebar-nav-item{flex-direction:column;gap:4px;padding:12px 14px;border-left:none;border-bottom:3px solid transparent;white-space:nowrap;font-size:12px;flex-shrink:0}
            .sidebar-nav-item.active{border-bottom-color:var(--saffron);border-left-color:transparent}
            .sidebar-divider{display:none}
            .wishlist-grid{grid-template-columns:repeat(2,1fr)}
            .form-grid{grid-template-columns:1fr}
        }
    </style>
</head>
<body>

<div class="ann-bar">🚚 Free delivery above <span>₹500</span> &nbsp;·&nbsp; 🌶️ Zero preservatives, 100% natural</div>

<nav>
    <a href="index.html" class="nav-logo">
        <span class="brand">Godavari Ghaatu</span>
        <span class="sub">Traditional Homemade Foods</span>
    </a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html?category=combo">Combos</a></li>
        <li><a href="products.html?category=pickle">Pickles</a></li>
        <li><a href="products.html?category=spice">Spices</a></li>
        <li><a href="products.html?category=laddu">Laddus</a></li>
    </ul>
    <div class="nav-actions">
        <button class="nav-icon-btn" id="cartBtn">🛒 <span class="cart-count" id="cartCount">0</span></button>
        <button class="btn-logout-nav" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="page-header">
    <div class="page-header-inner">
        <div class="avatar-circle" id="avatarCircle">?</div>
        <div class="user-greeting">
            <div class="hello">Welcome back,</div>
            <div class="uname" id="headerName">Loading...</div>
            <div class="uemail" id="headerEmail">—</div>
        </div>
        <div class="header-stats">
            <div class="hstat"><div class="hstat-num" id="statOrders">—</div><div class="hstat-label">Orders</div></div>
            <div class="hstat"><div class="hstat-num" id="statWishlist">—</div><div class="hstat-label">Wishlist</div></div>
        </div>
    </div>
</div>

<div class="profile-layout">
    <aside class="profile-sidebar">
        <div class="sidebar-card">
            <button class="sidebar-nav-item active" onclick="showTab('orders',this)"><span class="s-icon">📦</span> My Orders</button>
            <div class="sidebar-divider"></div>
            <button class="sidebar-nav-item" onclick="showTab('wishlist',this)"><span class="s-icon">♡</span> Wishlist</button>
            <div class="sidebar-divider"></div>
            <button class="sidebar-nav-item" onclick="showTab('account',this)"><span class="s-icon">👤</span> Account</button>
            <div class="sidebar-divider"></div>
            <button class="sidebar-nav-item" onclick="showTab('password',this)"><span class="s-icon">🔐</span> Password</button>
        </div>
    </aside>

    <div class="content-panel">

        <div class="tab-pane active" id="tab-orders">
            <div class="order-filters">
                <button class="order-filter-btn active" onclick="filterOrders('ALL',this)">All</button>
                <button class="order-filter-btn" onclick="filterOrders('PENDING',this)">Pending</button>
                <button class="order-filter-btn" onclick="filterOrders('PAID',this)">Paid</button>
                <button class="order-filter-btn" onclick="filterOrders('PACKED',this)">Packed</button>
                <button class="order-filter-btn" onclick="filterOrders('SHIPPED',this)">Shipped</button>
                <button class="order-filter-btn" onclick="filterOrders('DELIVERED',this)">Delivered</button>
            </div>
            <div id="ordersContainer"><div class="empty-state"><div class="empty-icon">⏳</div><p style="color:var(--muted)">Loading orders...</p></div></div>
        </div>

        <div class="tab-pane" id="tab-wishlist">
            <div class="card">
                <div class="card-head"><h3>My Wishlist</h3><span style="font-size:13px;color:var(--muted)" id="wishlistCount">—</span></div>
                <div class="card-body"><div id="wishlistGrid" class="wishlist-grid"></div></div>
            </div>
        </div>

        <div class="tab-pane" id="tab-account">
            <div class="card">
                <div class="card-head"><h3>Account Details</h3></div>
                <div class="card-body">
                    <div class="form-msg error" id="accErr"></div>
                    <div class="form-msg success" id="accSuc"></div>
                    <div class="form-grid">
                        <div class="field"><label>Full Name</label><input type="text" id="accName" placeholder="Your full name"></div>
                        <div class="field"><label>Email Address</label><input type="email" id="accEmail" disabled></div>
                    </div>
                    <div class="form-grid single" style="margin-bottom:20px">
                        <div class="field"><label>Phone Number</label><input type="tel" id="accPhone" placeholder="+91 98765 43210"></div>
                    </div>
                    <button class="btn-save" onclick="updateAccount()">Save Changes</button>
                </div>
            </div>
        </div>

        <div class="tab-pane" id="tab-password">
            <div class="card">
                <div class="card-head"><h3>Change Password</h3></div>
                <div class="card-body" style="max-width:420px">
                    <div class="form-msg error" id="pwErr"></div>
                    <div class="form-msg success" id="pwSuc"></div>
                    <div class="field" style="margin-bottom:16px"><label>Current Password</label><input type="password" id="pwCurrent" placeholder="Current password"></div>
                    <div class="field" style="margin-bottom:16px"><label>New Password</label><input type="password" id="pwNew" placeholder="Minimum 8 characters"></div>
                    <div class="field" style="margin-bottom:20px"><label>Confirm New Password</label><input type="password" id="pwConfirm" placeholder="Repeat new password"></div>
                    <button class="btn-save" onclick="changePassword()">Update Password</button>
                </div>
            </div>
        </div>

    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='http://localhost:8000/api/v1';
let token=localStorage.getItem('gg_token');
let allOrders=[];
let user=null;
const CAT_EMOJI={pickle:'🫙',spice:'🌶️',laddu:'🍡',combo:'🎁'};
const STATUS_ORDER=['PENDING','PAID','PACKED','SHIPPED','DELIVERED'];
const STATUS_ICONS={PENDING:'📋',PAID:'💳',PACKED:'📦',SHIPPED:'🚚',DELIVERED:'✓'};
const STATUS_LABELS={PENDING:'Placed',PAID:'Paid',PACKED:'Packed',SHIPPED:'Shipped',DELIVERED:'Delivered'};

document.addEventListener('DOMContentLoaded',()=>{
    if(!token){window.location.href='index.html';return;}
    const hash=window.location.hash.replace('#','')||'orders';
    const btn=document.querySelector('[onclick*="showTab(\''+hash+'\'"]');
    if(btn) showTab(hash,btn);
    fetchUser(); fetchOrders(); fetchCart();
    document.getElementById('cartBtn').onclick=()=>window.location.href='checkout.html';
});

function showTab(tab,el){
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.sidebar-nav-item').forEach(i=>i.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active');
    if(el) el.classList.add('active');
    window.location.hash=tab;
    if(tab==='wishlist') fetchWishlist();
}

async function fetchUser(){
    try{
        const res=await fetch(`${API}/users/me`,{headers:{Authorization:`Bearer ${token}`}});
        if(res.status===401){logout();return;}
        user=await res.json();
        const name=user.full_name||user.email.split('@')[0];
        const initials=name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
        document.getElementById('avatarCircle').textContent=initials;
        document.getElementById('headerName').textContent=name;
        document.getElementById('headerEmail').textContent=user.email;
        document.getElementById('accName').value=user.full_name||'';
        document.getElementById('accEmail').value=user.email||'';
        document.getElementById('accPhone').value=user.phone||'';
    }catch(e){}
}

async function fetchCart(){
    try{
        const res=await fetch(`${API}/cart`,{headers:{Authorization:`Bearer ${token}`}});
        if(res.ok){const c=await res.json();document.getElementById('cartCount').textContent=c.items?.length||0;}
    }catch(e){}
}

async function fetchOrders(){
    try{
        const res=await fetch(`${API}/orders`,{headers:{Authorization:`Bearer ${token}`}});
        if(!res.ok)return;
        allOrders=await res.json();
        document.getElementById('statOrders').textContent=allOrders.length;
        renderOrders(allOrders);
    }catch(e){showToast('Failed to load orders','error');}
}

function filterOrders(status,btn){
    document.querySelectorAll('.order-filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderOrders(status==='ALL'?allOrders:allOrders.filter(o=>o.status===status));
}

function renderOrders(orders){
    const c=document.getElementById('ordersContainer');
    if(!orders.length){
        c.innerHTML='<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-title">No orders yet</div><div class="empty-desc">Your order history will appear here</div><a href="products.html" class="btn-shop">Start Shopping</a></div>';
        return;
    }
    c.innerHTML=orders.map((order,i)=>{
        const date=new Date(order.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
        const items=order.items||[];
        const previewNames=items.slice(0,3).map(it=>it.product_name||'Product');
        const extra=items.length-previewNames.length;
        const subtotal=parseFloat(order.subtotal||order.total_amount||0);
        const delivery=parseFloat(order.delivery_charge||0);
        const tax=parseFloat(order.tax_amount||0);
        const total=parseFloat(order.total_amount||0);
        const isCancelled=order.status==='CANCELLED';
        const currentIdx=STATUS_ORDER.indexOf(order.status);
        const timelineHTML=STATUS_ORDER.map((s,idx)=>{
            let cls='';
            if(isCancelled){cls=idx===0?'done':s==='DELIVERED'?'cancelled':'';}
            else if(idx<currentIdx)cls='done';
            else if(idx===currentIdx)cls='current';
            const dot=isCancelled&&s==='DELIVERED'?'✕':(cls==='done'?'✓':STATUS_ICONS[s]);
            return `<div class="t-step ${cls}"><div class="t-dot">${dot}</div><div class="t-label">${STATUS_LABELS[s]}</div></div>`;
        }).join('');
        const itemsHTML=items.map(it=>`
            <div class="oi-row">
                <div class="oi-img">${CAT_EMOJI[it.category]||'🫙'}</div>
                <div style="flex:1"><div class="oi-name">${it.product_name||'Product'}</div><div class="oi-variant">${it.variant_label||'Standard'}</div></div>
                <div class="oi-qty">× ${it.quantity}</div>
                <div class="oi-price">₹${it.line_total||(it.unit_price*it.quantity)||'—'}</div>
            </div>`).join('');
        return `
        <div class="order-card" id="ocard-${order.id}">
            <div class="order-card-head" onclick="toggleOrder('${order.id}')">
                <div><div class="order-id-text">#${order.id.substring(0,8).toUpperCase()}</div><div class="order-date-text">${date}</div></div>
                <div style="display:flex;align-items:center;gap:12px">
                    <span class="order-status status-${order.status}">${order.status}</span>
                    <span class="order-expand-arrow">▾</span>
                </div>
            </div>
            <div class="order-card-body" onclick="toggleOrder('${order.id}')">
                <div class="order-items-preview">
                    ${previewNames.map(n=>`<span class="order-item-chip">🫙 ${n}</span>`).join('')}
                    ${extra>0?`<span class="order-item-chip">+${extra} more</span>`:''}
                </div>
                <div style="text-align:right;flex-shrink:0">
                    <div class="order-total-amt">₹${total.toFixed(2)}</div>
                    <div class="order-sub-info">${items.length} item${items.length!==1?'s':''}</div>
                </div>
            </div>
            <div class="order-detail-panel">
                <div class="timeline-wrap">
                    <div class="timeline-label">Order Status</div>
                    <div class="timeline-steps">${timelineHTML}</div>
                </div>
                <div class="order-items-section">
                    <div class="oi-section-label">Items Ordered</div>
                    ${itemsHTML||'<p style="color:var(--muted);font-size:13px">No item details</p>'}
                </div>
                <div class="order-breakdown">
                    <div class="ob-row"><span>Subtotal</span><span>₹${subtotal.toFixed(2)}</span></div>
                    <div class="ob-row"><span>Delivery</span><span>${delivery===0?'FREE':'₹'+delivery.toFixed(2)}</span></div>
                    <div class="ob-row"><span>GST (5%)</span><span>₹${tax.toFixed(2)}</span></div>
                    <div class="ob-row total"><span>Total Paid</span><span>₹${total.toFixed(2)}</span></div>
                </div>
            </div>
        </div>`;
    }).join('');
}

function toggleOrder(id){
    document.getElementById('ocard-'+id).classList.toggle('expanded');
}

async function fetchWishlist(){
    try{
        const res=await fetch(`${API}/wishlist`,{headers:{Authorization:`Bearer ${token}`}});
        if(!res.ok)return;
        const items=await res.json();
        document.getElementById('statWishlist').textContent=items.length;
        document.getElementById('wishlistCount').textContent=`${items.length} item${items.length!==1?'s':''}`;
        const grid=document.getElementById('wishlistGrid');
        if(!items.length){
            grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">♡</div><div class="empty-title">Wishlist is empty</div><div class="empty-desc">Save products you love for later</div><a href="products.html" class="btn-shop">Browse Products</a></div>';
            return;
        }
        grid.innerHTML=items.map(item=>`
            <div class="wish-card">
                <div class="wish-img">
                    ${CAT_EMOJI[item.category]||'🫙'}
                    <button class="wish-remove-btn" onclick="removeWishlist('${item.id}')" title="Remove">✕</button>
                </div>
                <div class="wish-body">
                    <div class="wish-name">${item.name}</div>
                    <div class="wish-price">From ₹${item.price}</div>
                    <button class="wish-atc" onclick="window.location.href='product.html?id=${item.id}'">View Product</button>
                </div>
            </div>`).join('');
    }catch(e){showToast('Failed to load wishlist','error');}
}

async function removeWishlist(productId){
    try{
        const res=await fetch(`${API}/wishlist/${productId}`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});
        if(res.ok){showToast('Removed from wishlist','');fetchWishlist();}
    }catch(e){}
}

async function updateAccount(){
    const err=document.getElementById('accErr'),suc=document.getElementById('accSuc');
    err.classList.remove('show');suc.classList.remove('show');
    const name=document.getElementById('accName').value.trim();
    const phone=document.getElementById('accPhone').value.trim();
    if(!name){err.textContent='Name is required';err.classList.add('show');return;}
    try{
        const res=await fetch(`${API}/users/me`,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({full_name:name,phone:phone||null})});
        const data=await res.json();
        if(res.ok){
            suc.textContent='Account updated successfully!';suc.classList.add('show');
            document.getElementById('headerName').textContent=data.full_name||name;
            document.getElementById('avatarCircle').textContent=name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
            showToast('Account updated ✅','success');
        }else{err.textContent=data.detail||'Update failed';err.classList.add('show');}
    }catch(e){err.textContent='Connection error';err.classList.add('show');}
}

async function changePassword(){
    const err=document.getElementById('pwErr'),suc=document.getElementById('pwSuc');
    err.classList.remove('show');suc.classList.remove('show');
    const current=document.getElementById('pwCurrent').value;
    const newPw=document.getElementById('pwNew').value;
    const confirm=document.getElementById('pwConfirm').value;
    if(!current||!newPw||!confirm){err.textContent='Please fill in all fields';err.classList.add('show');return;}
    if(newPw.length<8){err.textContent='New password must be at least 8 characters';err.classList.add('show');return;}
    if(newPw!==confirm){err.textContent='Passwords do not match';err.classList.add('show');return;}
    try{
        const res=await fetch(`${API}/users/me/password`,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({current_password:current,new_password:newPw})});
        const data=await res.json();
        if(res.ok){
            suc.textContent='Password changed successfully!';suc.classList.add('show');
            document.getElementById('pwCurrent').value='';
            document.getElementById('pwNew').value='';
            document.getElementById('pwConfirm').value='';
            showToast('Password updated 🔐','success');
        }else{err.textContent=data.detail||'Failed to change password';err.classList.add('show');}
    }catch(e){err.textContent='Connection error';err.classList.add('show');}
}

function logout(){localStorage.removeItem('gg_token');window.location.href='index.html';}

let toastTimer;
function showToast(msg,type=''){
    const t=document.getElementById('toast');
    t.textContent=msg;t.className=`toast ${type} show`;
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
